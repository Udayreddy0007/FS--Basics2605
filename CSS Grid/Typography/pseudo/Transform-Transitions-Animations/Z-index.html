<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-indexing</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .boxes {
            height: 100vh;
            width: 100vw;
            background-color: black;
        }

        .box1 {
            height: 150px;
            width: 150px;
            background-color: darkorange;
            border:5px solid white;
            position:relative;
            margin-left: 15px;
            top:20px;
            z-index:4;

        }
        .box2{
            height: 150px;
            width: 150px;
            background-color:darkolivegreen;
            border:5px solid greenyellow;
            position:relative;
            margin-left: 15px;
            top:-55px;
            z-index: 8;
        }

    </style>
</head>

<body>
    <div class="boxes">
        <div class="box1">BOX1</div>
        <div class="box2">BOX2</div>
    </div>
</body>

</html>
