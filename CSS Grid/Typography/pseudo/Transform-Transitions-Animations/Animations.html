

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            background-color: darkorange;
            height:100vh;
            width:100vw;
            position:relative;
        }
        .box1{
            height:25vh;
            width:20vw;
            background-color: black;
            color: aliceblue;
            animation-name:box1Animation;
            animation-duration: 4s;
            animation-timing-function: ease-in;
            /* animation-iteration-count:infinite; */
            animation-iteration-count: infinite;
            /* animation-direction:normal; */
            /* animation-direction: reverse; */
            /* animation-direction: alternate; */
            animation-direction: alternate-reverse;
            animation-delay: 2s;
        }

        @keyframes box1Animation {
            from{
                   height:25vh;
                  width:20vw;
                   background-color: black;
            }
            to{
                 height:75vh;
                 width:50vw;
                 background-color: darkorchid;      

            }
            
        }

            .box2{
            height:25vh;
            width:20vw;
            position: absolute;
            top: 0;
            right:0;
            background-color: black;
             /* float:right; */
            color: aliceblue;
            animation-name:box1Animation;
            animation-duration: 4s;
            animation-timing-function: ease-in;
            /* animation-iteration-count:infinite; */
            animation-iteration-count: infinite;
            /* animation-direction:normal; */
            /* animation-direction: reverse; */
            /* animation-direction: alternate; */
            animation-direction: alternate-reverse;
            animation-delay: 2s;
        }

         @keyframes box2Animation {
            from{
                   height:25vh;
                  width:20vw;
                   background-color: black;
            }
            to{
                 height:75vh;
                 width:50vw;
                 background-color: darkorchid;      

            }
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">Lorem, ipsum dolor.
        </div>
        <div class="box2">Lorem, ipsum dolor.</div>
    </div>

</body>
</html>
