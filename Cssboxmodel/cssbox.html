<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <style>
        
       body{
        background-color: rgb(238, 230, 230);
       }
       .box1{
          width:100px;
         text-align: center;
          height:100px;
          padding-top: 50px;
          color:rgb(0, 36, 67);
          background-color: rgb(238, 255, 3);
          border:5px solid rgb(223, 56, 56);
         
        }
        .box2{
            margin-top: 10px;
            width:100px;
            padding-top: 50px;
            text-align: center;
          height:100px;
            color:rgb(13, 13, 13);
            background-color: red;
            border:5px solid rgb(9, 9, 9);
        }
    </style>
</head>
<body>
    <div class="box1">My box 1</div>
    <div class="box2">My box 2</div>
    
</body>
</html>
